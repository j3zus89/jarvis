<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Humanoide de partículas</title>
<style>
  :root{
    --bg: #060607;
    --bg-2: #0b0c10;
    --accent: #ff9a3d;
    --text: #e7e5e0;
    --text-dim: #8a8a8f;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100%;
  }
  body{
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh;
    padding: 32px 16px 40px;
    background: radial-gradient(ellipse at 50% 30%, rgba(255,154,61,0.05), transparent 60%), var(--bg);
  }
  .stage{ position: relative; width: 100%; max-width: 620px; }
  .frame{
    position: relative; width: 100%;
    aspect-ratio: var(--ar, 760/547);
    border-radius: 4px; overflow: hidden;
    background: var(--bg-2);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
  }
  canvas{ display: block; width: 100%; height: 100%; }
  .caption{ margin-top: 18px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .caption p{ margin: 0; font-size: 13px; line-height: 1.5; color: var(--text-dim); max-width: 420px; }
  button{
    flex-shrink: 0; background: transparent; border: 1px solid rgba(255,154,61,0.4); color: var(--accent);
    font-size: 12.5px; letter-spacing: 0.02em; padding: 9px 16px; border-radius: 3px; cursor: pointer;
    font-family: inherit; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  button:hover{ background: rgba(255,154,61,0.12); border-color: var(--accent); }
  button:active{ background: rgba(255,154,61,0.22); }
  .loading{
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--text-dim); letter-spacing: 0.04em;
  }
  .fps{
    position: absolute; top: 6px; left: 8px; font-size: 10px; color: rgba(255,255,255,0.35);
    font-family: monospace; pointer-events: none;
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="frame" id="frame">
      <canvas id="c"></canvas>
      <div class="loading" id="loading">cargando…</div>
      <div class="fps" id="fps"></div>
    </div>
    <div class="caption">
      <p>Cada partícula tiene inercia real: es atraída a su sitio como por gravedad, con un pequeño giro al acercarse.</p>
      <button id="replay">Reformar</button>
    </div>
  </div>

    const sw = img.naturalWidth, sh = img.naturalHeight;

    const sample = document.createElement('canvas');
    sample.width = sw; sample.height = sh;
    const sctx = sample.getContext('2d');
    sctx.drawImage(img, 0, 0, sw, sh);
    const data = sctx.getImageData(0, 0, sw, sh).data;

    function brightnessAt(xx, yy){
      if (xx < 0 || yy < 0 || xx >= sw || yy >= sh) return 0;
      const idx = (yy * sw + xx) * 4;
      return Math.max(data[idx], data[idx+1], data[idx+2]);
    }

    bufW = Math.round(sw * RENDER_SCALE);
    bufH = Math.round(sh * RENDER_SCALE);

    canvas.width = bufW * dpr;
    canvas.height = bufH * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    glowCanvas.width = bufW * dpr;
    glowCanvas.height = bufH * dpr;
    glowCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    frameEl.style.setProperty('--ar', sw + '/' + sh);

    const cx = bufW / 2, cy = bufH / 2;
    const maxDist = Math.hypot(cx, cy);
    const burstRadius = Math.max(bufW, bufH) * 0.72;

    const list = [];
    for (let y = 0; y < sh; y += SAMPLE_STEP){
      for (let x = 0; x < sw; x += SAMPLE_STEP){
        const idx = (y * sw + x) * 4;
        const r = data[idx], g = data[idx+1], b = data[idx+2];
        const brightness = Math.max(r, g, b);
        if (brightness < BRIGHTNESS_THRESHOLD) continue;

        const isEdge = (
          brightnessAt(x - EDGE_CHECK_DIST, y) < BRIGHTNESS_THRESHOLD ||
          brightnessAt(x + EDGE_CHECK_DIST, y) < BRIGHTNESS_THRESHOLD ||
          brightnessAt(x, y - EDGE_CHECK_DIST) < BRIGHTNESS_THRESHOLD ||
          brightnessAt(x, y + EDGE_CHECK_DIST) < BRIGHTNESS_THRESHOLD
        );
        const isWarm = r > 140 && r > b * 1.25 && g < r * 0.85;

        const homeX = x * RENDER_SCALE + (Math.random() - 0.5) * RENDER_SCALE;
        const homeY = y * RENDER_SCALE + (Math.random() - 0.5) * RENDER_SCALE;
        const distFromCenter = Math.hypot(homeX - cx, homeY - cy);
        const delay = (distFromCenter / maxDist) * 0.8 + Math.random() * 0.5;
        const spawn = makeSpawn(cx, cy, burstRadius);

        list.push({
          homeX, homeY,
          x: spawn.x, y: spawn.y, vx: 0, vy: 0,
          r, g, b, isWarm, isEdge,
          size: isEdge ? (1.3 + Math.random() * 0.9) : (1.4 + Math.random() * 1.2),
          delay,
          rowPhase: homeY * ROW_PHASE + (Math.random() - 0.5) * 0.3,
          phase: Math.random() * Math.PI * 2,
          glow: isEdge ? (Math.random() < 0.5) : isWarm
        });
      }
    }
    particles = list;

    sparks = Array.from({ length: SPARK_COUNT }, () => {
      const warm = Math.random() < 0.4;
      return {
        baseX: Math.random() * bufW,
        baseY: Math.random() * bufH,
        ampX: 30 + Math.random() * 130,
        ampY: 20 + Math.random() * 90,
        speed: 0.05 + Math.random() * 0.14,
        phase: Math.random() * Math.PI * 2,
        twinkleSpeed: 0.6 + Math.random() * 1.4,
        size: 0.6 + Math.random() * 1.0,
        color: warm ? '255,190,140' : '200,210,225'
      };
    });
  }

  let frameCount = 0, fpsAccum = 0, fpsLastReport = performance.now();

  function frame(now){
    let dt = (now - lastTime) / 1000;
    if (dt > DT_MAX) dt = DT_MAX;
    lastTime = now;
    const t = (now - startTime) / 1000;

    ctx.fillStyle = 'rgba(6,6,7,0.35)';
    ctx.fillRect(0, 0, bufW, bufH);
    glowCtx.clearRect(0, 0, bufW, bufH);

    for (let i = 0; i < sparks.length; i++){
      const s = sparks[i];
      const sx = s.baseX + Math.sin(t * s.speed + s.phase) * s.ampX;
      const sy = s.baseY + Math.cos(t * s.speed * 0.8 + s.phase) * s.ampY;
      const twinkle = 0.15 + 0.45 * Math.abs(Math.sin(t * s.twinkleSpeed + s.phase));
      ctx.beginPath();
      ctx.fillStyle = `rgba(${s.color},${twinkle})`;
      ctx.arc(sx, sy, s.size, 0, Math.PI * 2);
      ctx.fill();
    }

    const windX = Math.sin(t * WIND_FREQ_X) * WIND_AMP_X;
    const windY = Math.cos(t * WIND_FREQ_Y) * WIND_AMP_Y;

    for (let i = 0; i < particles.length; i++){
      const p = particles[i];
      const activation = Math.min(1, Math.max(0, (t - p.delay) / ACTIVATE_RAMP));

      let targetX = p.homeX, targetY = p.homeY;
      if (p.isEdge){
        targetY += Math.sin(targetX * RIPPLE_FREQ_X + t * RIPPLE_SPEED + p.rowPhase) * RIPPLE_AMP;
      }

      const dx = targetX - p.x, dy = targetY - p.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      let ax = dx * K - p.vx * C;
      let ay = dy * K - p.vy * C;

      if (dist > ORBIT_MIN_DIST){
        const inv = 1 / dist;
        ax += -dy * inv * ORBIT_STRENGTH;
        ay +=  dx * inv * ORBIT_STRENGTH;
      }

      ax *= activation; ay *= activation;
      ax += windX * activation; ay += windY * activation;

      p.vx += ax * dt; p.vy += ay * dt;
      p.x  += p.vx * dt; p.y += p.vy * dt;

      let pulse = 1;
      if (p.isWarm) pulse = 0.75 + 0.35 * Math.sin(t * 2.1 + p.phase);

      const alpha = (0.3 + activation * 0.7) * pulse;

      ctx.beginPath();
      ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${alpha})`;
      if (p.isEdge){
        ctx.ellipse(p.x, p.y, p.size * 2.0, p.size * 0.72, 0, 0, Math.PI * 2);
      } else {
        ctx.arc(p.x, p.y, p.size * pulse, 0, Math.PI * 2);
      }
      ctx.fill();

      if (p.glow && activation > 0.6){
        glowCtx.beginPath();
        glowCtx.fillStyle = `rgba(${p.r},${p.g},${p.b},${Math.min(1, alpha)})`;
        if (p.isEdge){
          glowCtx.ellipse(p.x, p.y, p.size * 2.0, p.size * 0.72, 0, 0, Math.PI * 2);
        } else {
          glowCtx.arc(p.x, p.y, p.size * pulse * 1.3, 0, Math.PI * 2);
        }
        glowCtx.fill();
      }
    }

    // el desenfoque se aplica UNA sola vez por frame sobre toda la capa, no por partícula
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.filter = 'blur(3.5px)';
    ctx.drawImage(glowCanvas, 0, 0, bufW, bufH);
    ctx.restore();

    frameCount++; fpsAccum += dt;
    if (now - fpsLastReport > 500){
      fpsEl.textContent = Math.round(frameCount / fpsAccum) + ' fps';
      frameCount = 0; fpsAccum = 0; fpsLastReport = now;
    }

    requestAnimationFrame(frame);
  }

  function replay(){
    const cx = bufW / 2, cy = bufH / 2;
    const burstRadius = Math.max(bufW, bufH) * 0.72;
    const maxDist = Math.hypot(cx, cy);
    for (let i = 0; i < particles.length; i++){
      const p = particles[i];
      const spawn = makeSpawn(cx, cy, burstRadius);
      p.x = spawn.x; p.y = spawn.y; p.vx = 0; p.vy = 0;
      const distFromCenter = Math.hypot(p.homeX - cx, p.homeY - cy);
      p.delay = (distFromCenter / maxDist) * 0.8 + Math.random() * 0.5;
    }
    startTime = performance.now();
    lastTime = startTime;
  }
  replayBtn.addEventListener('click', replay);

  const img = new Image();
  img.onload = function(){
    buildParticles(img);
    loadingEl.style.display = 'none';
    startTime = performance.now();
    lastTime = startTime;
    requestAnimationFrame(frame);
  };
  img.onerror = function(){
    loadingEl.textContent = 'no se pudo cargar la imagen';
  };
  img.src = IMG_SRC;
})();
</script>
</body>
</html>
